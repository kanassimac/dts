<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>金句尋寶王｜一壘班背經闖關</title><style>
:root{--bg:#0c1730;--panel:#152746;--border:#38516e;--fg:#f8fafc;--muted:#bfd0df;--accent:#f9cd70;--mint:#76e3c6}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 85% 0%,#284d69,transparent 40%),var(--bg);color:var(--fg);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:30px 24px 60px}header{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}.eyebrow{color:var(--mint);letter-spacing:.2em;font-size:15px;font-weight:800}h1{font-size:clamp(33px,5vw,62px);margin:12px 0}p{color:var(--muted);line-height:1.75}.sub{font-size:19px}.panel{background:rgba(21,39,70,.95);border:1px solid var(--border);border-radius:22px;padding:clamp(20px,3vw,34px);box-shadow:0 10px 35px #0003;margin-top:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.lesson{background:#213859;border:1px solid #4b6381;border-radius:16px;padding:22px 18px;text-align:left;color:var(--fg);cursor:pointer;min-height:122px;transition:.15s}.lesson:hover,.lesson:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}.lesson strong{display:block;font-size:25px;margin-bottom:10px}.lesson span{color:var(--muted);font-size:17px}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button{font:inherit}button.action{background:var(--accent);color:#18243a;border:0;padding:13px 22px;border-radius:12px;font-weight:800;cursor:pointer}button.secondary{background:#29415d;color:#fff;border:1px solid #607a96;padding:12px 20px;border-radius:12px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.back{background:none;color:var(--muted);border:0;cursor:pointer;font-size:16px;padding:8px 0}.topline{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.pill{border:1px solid #6383a1;padding:7px 14px;border-radius:999px;color:#d5e7f6;font-weight:700}.stage{font-size:clamp(18px,2.7vw,28px);color:var(--accent);font-weight:800;margin:18px 0 5px}.verse{font-size:clamp(24px,3.15vw,35px);line-height:2.25;letter-spacing:.025em;margin:20px 0 26px;word-break:normal;overflow-wrap:anywhere}.hidden{display:inline-block;vertical-align:baseline;min-width:1.7em;border-bottom:3px solid var(--accent);background:#526378aa;color:transparent;border-radius:4px 4px 0 0;line-height:1.2;padding:.16em .13em .09em;margin:0 .07em;user-select:none}.reveal .hidden{color:#fff;background:#287164;border-color:var(--mint);user-select:text}.helper{font-size:16px;line-height:1.8}.progress{height:12px;border-radius:99px;background:#32445a;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--mint),var(--accent));transition:width .3s}.results{text-align:center;padding:45px 12px}.results h2{font-size:36px;color:var(--accent)}.small{font-size:14px;color:#b8c9d9}button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){.wrap{padding:20px 15px 40px}.verse{line-height:2.35}.panel{padding:20px 16px}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">一壘班 · 七堂課 · 金句挑戰</div><h1>金句尋寶王</h1><div class="sub" id="subtitle">看見提示，說出經文，三回合越背越熟！</div></div><button class="secondary" id="homeTop" hidden>⌂ 回首頁</button></header>
<section class="panel" id="home"><h2>選擇背誦課次</h2><p>第四、六、七課各有兩則金句，進入後可自行選擇，或點選「隨機抽題」。</p><div class="grid" id="lessons"></div><div class="tools" style="margin-top:20px"><button class="action" id="randomAll">✦ 七課隨機抽一題</button></div></section>
<section class="panel" id="choice" hidden><button class="back" id="backChoice">← 返回選課</button><h2 id="choiceTitle"></h2><p>選擇要練習的金句；也可以隨機抽選本課金句。</p><div class="grid" id="choices"></div><div class="tools" style="margin-top:18px"><button class="action" id="randomLesson">✦ 本課隨機抽題</button></div></section>
<section class="panel" id="game" hidden><div class="topline"><button class="back" id="backGame">← 回首頁重新選題</button><div class="pill" id="roundPill"></div></div><div class="stage" id="stageTitle"></div><h2 id="gameRef" style="margin:6px 0 0"></h2><div class="progress"><div id="bar"></div></div><div class="verse" id="verse" aria-live="polite"></div><p class="helper" id="instruction"></p><div class="tools"><button class="secondary" id="toggleAnswer">顯示答案</button><button class="action" id="nextRound">完成背誦，進入下一回合 →</button><button class="secondary" id="reroll">重新隨機遮字</button></div></section>
<section class="panel results" id="finish" hidden><div style="font-size:48px">★</div><h2>三回合挑戰完成！</h2><p id="doneText"></p><div class="tools" style="justify-content:center"><button class="action" id="retry">同一金句，再挑戰一次</button><button class="secondary" id="doneHome">回首頁，重新選題</button></div></section>
<p class="small">經文依課程提供文字編排。每次進入、每回合與「重新隨機遮字」都會重新抽選隱藏位置；這是口頭背誦練習，不會辨識或評分語音。</p></main><script>
const DATA=[{"lesson": 1, "topic": "如何靈修禱告？", "ref": "馬太福音 6:9–13", "text": "所以，你們禱告要這樣說：我們在天上的父：願人都尊你的名為聖。願你的國降臨；願你的旨意行在地上，如同行在天上。我們日用的飲食，今日賜給我們。免我們的債，如同我們免了人的債。不叫我們遇見試探；救我們脫離兇惡。因為國度、權柄、榮耀，全是你的，直到永遠。阿們！"}, {"lesson": 2, "topic": "教會", "ref": "彼得前書 2:9", "text": "惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民，要叫你們宣揚那召你們出黑暗入奇妙光明者的美德。"}, {"lesson": 3, "topic": "上帝論", "ref": "以賽亞書 40:28", "text": "你豈不曾知道嗎？你豈不曾聽見嗎？永在的神耶和華，創造地極的主，並不疲乏，也不困倦；他的智慧無法測度。"}, {"lesson": 4, "topic": "救恩論", "ref": "約翰福音 3:16", "text": "神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不致滅亡，反得永生。"}, {"lesson": 4, "topic": "末世論", "ref": "啟示錄 21:3–4", "text": "我聽見有大聲音從寶座出來說：「看哪，神的帳幕在人間。他要與人同住，他們要作他的子民。神要親自與他們同在，作他們的神。神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。」"}, {"lesson": 5, "topic": "以神為中心的生活", "ref": "羅馬書 12:1–2", "text": "所以弟兄們，我以神的慈悲勸你們，將身體獻上，當作活祭，是聖潔的，是神所喜悅的；你們如此事奉，乃是理所當然的。不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。"}, {"lesson": 6, "topic": "作見證", "ref": "使徒行傳 1:8", "text": "但聖靈降臨在你們身上，你們就必得著能力，並要在耶路撒冷、猶太全地，和撒馬利亞，直到地極，作我的見證"}, {"lesson": 6, "topic": "奉獻", "ref": "詩篇 24:1", "text": "地和其中所充滿的，世界和住在其間的，都屬耶和華。"}, {"lesson": 7, "topic": "服事", "ref": "彼得前書 4:10", "text": "各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。"}, {"lesson": 7, "topic": "聚會", "ref": "希伯來書 10:24–25", "text": "又要彼此相顧，激發愛心，勉勵行善。你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉，既知道那日子臨近，就更當如此。"}];
const LESSONS=['如何靈修禱告？','教會','上帝論','救恩論與末世論','以神為中心的生活','作見證與奉獻','服事與聚會'];
const $=id=>document.getElementById(id);let lesson=1,current=null,round=0,shown=false,parts=[],masked=[];
function show(view){for(const id of ['home','choice','game','finish'])$(id).hidden=id!==view;$('homeTop').hidden=view==='home';window.scrollTo({top:0,behavior:'instant'});}
function selectLesson(n){lesson=n;const opts=DATA.filter(d=>d.lesson===n);if(opts.length===1){start(opts[0]);return;}$('choiceTitle').textContent=`第 ${n} 課｜${LESSONS[n-1]}`;$('choices').replaceChildren();opts.forEach(d=>{const b=document.createElement('button');b.className='lesson';b.innerHTML=`<strong>${d.topic}</strong><span>${d.ref}</span>`;b.onclick=()=>start(d);$('choices').append(b)});show('choice')}
function secureRandom(n){if(window.crypto?.getRandomValues){const a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=secureRandom(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const punctuation=/[，。；：！？「」『』、（）\s]/u;
function tokenize(text){ // Group Han characters in short natural chunks to make missing sections pronounceable.
 const out=[];let block='';const flush=()=>{if(block){const a=Array.from(block);for(let i=0;i<a.length;){let len=Math.min(a.length-i,2+(secureRandom(3)));out.push({value:a.slice(i,i+len).join(''),maskable:true});i+=len}block=''}};
 for(const c of text){if(punctuation.test(c)){flush();out.push({value:c,maskable:false})}else block+=c}flush();return out;
}
function newMask(){parts=tokenize(current.text);const ids=parts.map((p,i)=>p.maskable?i:-1).filter(i=>i!==-1), ratio=[.30,.50,.80][round];const chosen=shuffle([...ids]).slice(0,Math.max(1,Math.round(ids.length*ratio)));masked=new Set(chosen);shown=false;render();}
function render(){const r=round+1;const ratio=[30,50,80][round];$('roundPill').textContent=`第 ${r}／3 回合 · 隱藏約 ${ratio}%`;$('stageTitle').textContent=`第 ${current.lesson} 課｜${current.topic}`;$('gameRef').textContent=current.ref;$('bar').style.width=`${r/3*100}%`;$('verse').replaceChildren();$('verse').classList.toggle('reveal',shown);parts.forEach((p,i)=>{const s=document.createElement('span');s.textContent=p.value;if(masked.has(i))s.className='hidden';$('verse').append(s)});$('toggleAnswer').textContent=shown?'再次隱藏答案':'顯示答案';$('nextRound').textContent=round===2?'完成第三回合 ✓':'完成背誦，進入下一回合 →';$('instruction').textContent=shown?'綠色部分是本回合被隱藏的答案。確認後可進入下一回合。':'請先看提示把遮住的詞句口頭背出來；需要核對時，點「顯示答案」。'}
function start(item){current=item;round=0;newMask();show('game')}
for(let i=1;i<=7;i++){const b=document.createElement('button');b.className='lesson';b.innerHTML=`<strong>第 ${i} 課</strong><span>${LESSONS[i-1]}${DATA.filter(d=>d.lesson===i).length>1?' · 2 則金句':''}</span>`;b.onclick=()=>selectLesson(i);$('lessons').append(b)}
$('randomAll').onclick=()=>start(DATA[secureRandom(DATA.length)]);$('randomLesson').onclick=()=>{const options=DATA.filter(d=>d.lesson===lesson);start(options[secureRandom(options.length)])};$('homeTop').onclick=()=>show('home');$('backChoice').onclick=()=>show('home');$('backGame').onclick=()=>show('home');$('doneHome').onclick=()=>show('home');$('toggleAnswer').onclick=()=>{shown=!shown;render()};$('reroll').onclick=newMask;$('retry').onclick=()=>start(current);$('nextRound').onclick=()=>{if(round===2){$('doneText').textContent=`第 ${current.lesson} 課｜${current.topic}（${current.ref}）`;show('finish')}else{round++;newMask()}};
</script></body></html>
